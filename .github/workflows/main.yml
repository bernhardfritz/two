name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.examples.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tinygo
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build library and plugin
        run: npm run build
      - name: List examples
        id: examples
        run: |
          examples=$(ls -d ./examples/*/ | xargs -n1 basename | awk -v ORS=',' '{print "\""$0"\""}' | sed 's/,$//')
          echo "matrix=[${examples}]" >> $GITHUB_OUTPUT
      - name: Upload dist folder
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
  build-examples:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: ${{ fromJson(needs.build.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tinygo
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download dist folder
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install dependencies
        run: npm --prefix "./examples/${{ matrix.example }}" ci
      - name: Build example
        run: npm --prefix "./examples/${{ matrix.example }}" run build -- --base /two/${{ matrix.example }}/
      - name: Upload example
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.example }}
          path: examples/${{ matrix.example }}/dist/
          retention-days: 1
  deploy:
    needs: build-examples
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
      - name: Create directory
        run: mkdir two
      - name: Download examples
        uses: actions/download-artifact@v8
        with:
          path: two/
          pattern: '!dist'
      - name: Generate index.html
        run: |
          index_html=$(go run index/index.go two/)
          echo "$index_html" > two/index.html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./two/