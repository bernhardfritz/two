name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.examples.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: bernhardfritz/setup-tinygo@v1
        with:
          go-version: '1.26.2'
          tinygo-version: '0.41.1'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - name: Install dependencies
        run: npm ci
      - name: Build library and plugin
        run: npm run build
      - name: List examples
        id: examples
        run: |
          examples=$(ls -d ./examples/*/ | xargs -n1 basename | awk -v ORS=',' '{print "\""$0"\""}' | sed 's/,$//')
          echo "matrix=[${examples}]" >> $GITHUB_OUTPUT
      - name: Upload dist folder
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
  build-examples:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: ${{ fromJson(needs.build.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
      - uses: bernhardfritz/setup-tinygo@v1
        with:
          go-version: '1.26.2'
          tinygo-version: '0.41.1'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - name: Download dist folder
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install dependencies
        run: npm --prefix "./examples/${{ matrix.example }}" ci
      - name: Build example
        run: npm --prefix "./examples/${{ matrix.example }}" run build -- --base /flatland/${{ matrix.example }}/
      - name: Upload example
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.example }}
          path: examples/${{ matrix.example }}/dist/
          retention-days: 1
  prepareDeployment:
    needs: build-examples
    runs-on: ubuntu-latest
    steps:
      - name: Download examples
        uses: actions/download-artifact@v8
        with:
          pattern: '!dist'
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5 # or specific "vX.X.X" version tag for this action
        with:
          path: ./
  deploy:
    if: github.ref == 'refs/heads/main'

    # Add a dependency to the prepareDeployment job
    needs: prepareDeployment

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # or specific "vX.X.X" version tag for this action